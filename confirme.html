<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>42,2 · Compte confirmé</title>
<link rel="stylesheet" href="style.css">
<style>
.ok{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.check{width:84px;height:84px;border-radius:42px;background:#3DDC97;display:flex;align-items:center;justify-content:center}
.check svg{width:44px;height:44px}
.big{font-size:40px;line-height:1.05;font-weight:900;margin:8px 0 0}
.en{opacity:.75;margin-top:28px;padding-top:18px;border-top:1px solid rgba(127,127,127,.25)}
</style>
</head>
<body>
<main class="ok">
<div class="brand">42,2</div>
<div class="check"><svg viewBox="0 0 256 256"><path d="M56 132l44 44 100-100" stroke="#07090E" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<p class="big">Ton compte est confirmé.</p>
<p>Retourne dans l'app 42,2 sur ton iPhone : tu peux te connecter avec ton e-mail et ton mot de passe.</p>
<div class="en">
<p><strong>Your account is confirmed.</strong> Go back to the 42.2 app on your iPhone and sign in with your email and password.</p>
</div>
</main>
</body>
</html>
